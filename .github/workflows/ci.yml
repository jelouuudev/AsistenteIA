name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # SDK 10 (los proyectos apuntan a net8.0; el .slnx exige SDK 9+)
          dotnet-version: "10.0.x"
      - run: dotnet restore AsistenteIA.slnx
      - run: dotnet build AsistenteIA.slnx -c Release --no-restore
      - run: dotnet test AsistenteIA.slnx --no-build -c Release
